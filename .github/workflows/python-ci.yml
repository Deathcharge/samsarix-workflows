name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions. Defaults to the oldest supported baseline and current stable release.
        required: false
        type: string
        default: '["3.12", "3.14"]'
      runs-on:
        description: GitHub-hosted runner label.
        required: false
        type: string
        default: ubuntu-latest
      working-directory:
        description: Project directory relative to the repository root.
        required: false
        type: string
        default: .
      cache-dependency-path:
        description: Dependency file or glob used for the pip cache key.
        required: false
        type: string
        default: '**/pyproject.toml'
      install-command:
        description: Trusted repository command used to install the project and test dependencies. Empty skips installation.
        required: false
        type: string
        default: python -m pip install -e '.[dev]'
      lint-command:
        description: Trusted repository lint command. Empty skips linting.
        required: false
        type: string
        default: ''
      typecheck-command:
        description: Trusted repository type-check command. Empty skips type checking.
        required: false
        type: string
        default: ''
      test-command:
        description: Trusted repository test command. Empty skips tests.
        required: false
        type: string
        default: python -m pytest
      build-command:
        description: Trusted repository build command. Empty skips the build.
        required: false
        type: string
        default: ''
      fail-fast:
        description: Cancel remaining matrix jobs after the first failure.
        required: false
        type: boolean
        default: false
      max-parallel:
        description: Maximum matrix jobs allowed to run at the same time.
        required: false
        type: number
        default: 2
      timeout-minutes:
        description: Maximum runtime for each matrix job.
        required: false
        type: number
        default: 20

permissions:
  contents: read

jobs:
  ci:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}

    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Install dependencies
        if: ${{ inputs.install-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SAMSARIX_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$SAMSARIX_COMMAND"

      - name: Lint
        if: ${{ inputs.lint-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SAMSARIX_COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$SAMSARIX_COMMAND"

      - name: Type check
        if: ${{ inputs.typecheck-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SAMSARIX_COMMAND: ${{ inputs.typecheck-command }}
        run: bash -euo pipefail -c "$SAMSARIX_COMMAND"

      - name: Test
        if: ${{ inputs.test-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SAMSARIX_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$SAMSARIX_COMMAND"

      - name: Build
        if: ${{ inputs.build-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SAMSARIX_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$SAMSARIX_COMMAND"

      - name: Write job summary
        if: ${{ always() }}
        env:
          SAMSARIX_JOB_STATUS: ${{ job.status }}
          SAMSARIX_RUNTIME_VERSION: ${{ matrix.python-version }}
        run: |
          {
            printf '### Python CI\n\n'
            printf -- '- Version: \x60%s\x60\n' "$SAMSARIX_RUNTIME_VERSION"
            printf -- '- Result: **%s**\n' "$SAMSARIX_JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
