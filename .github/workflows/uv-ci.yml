name: Reusable uv CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions. Defaults to the oldest supported baseline and current stable release.
        required: false
        type: string
        default: '["3.12", "3.14"]'
      uv-version:
        description: Exact uv version installed by the pinned setup action.
        required: false
        type: string
        default: '0.12.0'
      runs-on:
        description: GitHub-hosted runner label.
        required: false
        type: string
        default: ubuntu-latest
      working-directory:
        description: Project directory relative to the repository root.
        required: false
        type: string
        default: .
      cache-dependency-glob:
        description: Dependency file or glob used for the uv cache key.
        required: false
        type: string
        default: '**/uv.lock'
      sync-command:
        description: Trusted repository command used to sync the locked environment. Empty skips synchronization.
        required: false
        type: string
        default: uv sync --locked
      lint-command:
        description: Trusted repository lint command. Empty skips linting.
        required: false
        type: string
        default: ''
      typecheck-command:
        description: Trusted repository type-check command. Empty skips type checking.
        required: false
        type: string
        default: ''
      test-command:
        description: Trusted repository test command. Empty skips tests.
        required: false
        type: string
        default: uv run --locked pytest
      build-command:
        description: Trusted repository build command. Empty skips the build.
        required: false
        type: string
        default: ''
      fail-fast:
        description: Cancel remaining matrix jobs after the first failure.
        required: false
        type: boolean
        default: false
      max-parallel:
        description: Maximum matrix jobs allowed to run at the same time.
        required: false
        type: number
        default: 2
      timeout-minutes:
        description: Maximum runtime for each matrix job.
        required: false
        type: number
        default: 20

permissions:
  contents: read

jobs:
  ci:
    name: uv / Python ${{ matrix.python-version }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}

    steps:
      - name: Check out caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv and Python
        id: setup-uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ matrix.python-version }}
          working-directory: ${{ inputs.working-directory }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.cache-dependency-glob }}

      - name: Sync locked environment
        if: ${{ inputs.sync-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SAMSARIX_COMMAND: ${{ inputs.sync-command }}
        run: bash -euo pipefail -c "$SAMSARIX_COMMAND"

      - name: Lint
        if: ${{ inputs.lint-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SAMSARIX_COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$SAMSARIX_COMMAND"

      - name: Type check
        if: ${{ inputs.typecheck-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SAMSARIX_COMMAND: ${{ inputs.typecheck-command }}
        run: bash -euo pipefail -c "$SAMSARIX_COMMAND"

      - name: Test
        if: ${{ inputs.test-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SAMSARIX_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$SAMSARIX_COMMAND"

      - name: Build
        if: ${{ inputs.build-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SAMSARIX_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$SAMSARIX_COMMAND"

      - name: Write job summary
        if: ${{ always() }}
        env:
          SAMSARIX_JOB_STATUS: ${{ job.status }}
          SAMSARIX_PYTHON_VERSION: ${{ matrix.python-version }}
          SAMSARIX_UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
        run: |
          printf '### uv CI\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Python: `%s`\n' "$SAMSARIX_PYTHON_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- uv: `%s`\n' "$SAMSARIX_UV_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Result: **%s**\n' "$SAMSARIX_JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
