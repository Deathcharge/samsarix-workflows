name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Run SonarQube Scanner
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true

    - name: Run CodeFactor
      uses: codefactor-io/codefactor-action@master
      with:
        comtoken: ${{ secrets.CODEFACTOR_PROJECTTOKEN }}
      continue-on-error: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python linting tools
      run: |
        pip install pylint black isort flake8 bandit
      continue-on-error: true

    - name: Check Python code formatting
      run: |
        black --check . 2>/dev/null || true
        isort --check-only . 2>/dev/null || true
      continue-on-error: true

    - name: Pylint
      run: |
        find . -name "*.py" -type f ! -path "./.git/*" ! -path "./.*" | xargs pylint --disable=all --enable=E,F 2>/dev/null || true
      continue-on-error: true

    - name: Bandit security check
      run: |
        bandit -r . -f json -o bandit-report.json 2>/dev/null || true
      continue-on-error: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Node.js linting tools
      run: |
        npm install -g eslint prettier stylelint
      continue-on-error: true

    - name: Check JavaScript code formatting
      run: |
        prettier --check . 2>/dev/null || true
      continue-on-error: true

    - name: ESLint
      run: |
        eslint . --ext .js,.jsx,.ts,.tsx 2>/dev/null || true
      continue-on-error: true
