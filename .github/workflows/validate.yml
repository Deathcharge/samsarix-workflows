name: Validate workflows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked tooling
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Install actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 60 --retry 2 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" actionlint

      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml examples/*.yml

  python-smoke:
    name: Python consumer smoke test
    permissions:
      contents: read
    uses: ./.github/workflows/python-ci.yml
    with:
      python-versions: '["3.14"]'
      working-directory: test/fixtures/python
      cache-dependency-path: test/fixtures/python/pyproject.toml
      timeout-minutes: 10

  node-smoke:
    name: Node consumer smoke test
    permissions:
      contents: read
    uses: ./.github/workflows/node-ci.yml
    with:
      node-versions: '["24"]'
      working-directory: test/fixtures/node
      cache-dependency-path: test/fixtures/node/package-lock.json
      timeout-minutes: 10
