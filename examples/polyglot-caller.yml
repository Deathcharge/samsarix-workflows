name: Polyglot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    uses: Deathcharge/samsarix-workflows/.github/workflows/uv-ci.yml@1d345715ab998124dfda301d0c4dca1484615cfd
    with:
      working-directory: apps/backend
      cache-dependency-glob: uv.lock
      max-parallel: 2

  frontend:
    uses: Deathcharge/samsarix-workflows/.github/workflows/node-ci.yml@1d345715ab998124dfda301d0c4dca1484615cfd
    with:
      working-directory: apps/frontend
      cache-dependency-path: apps/frontend/package-lock.json
      max-parallel: 2
