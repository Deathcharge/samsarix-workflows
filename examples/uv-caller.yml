name: uv CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: Deathcharge/samsarix-workflows/.github/workflows/uv-ci.yml@master
    with:
      lint-command: uv run --locked ruff check .
      typecheck-command: uv run --locked mypy .
      build-command: uv build
