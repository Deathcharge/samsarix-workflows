name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: Deathcharge/samsarix-workflows/.github/workflows/python-ci.yml@3a0309cd76820de898f4ff250cfbe01009c8598a
    with:
      lint-command: python -m ruff check .
      typecheck-command: python -m mypy .
      build-command: python -m build
